plugins {
    id 'java'
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

application {
    mainClass = 'organizaai.Main'
}

// Garante a leitura da entrada do usuário
tasks.named('run') {
    standardInput = System.in
    jvmArgs '-Dfile.encoding=UTF-8'
}

// Garante que a compilação leia os arquivos-fonte em UTF-8 (acentos em comentários e textos)
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Garante que a geração do Javadoc não falhe por causa de acentos nos comentários
tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}