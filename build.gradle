plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.0.13' // para  javafx
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'

    implementation "org.openjfx:javafx-base:17"
    implementation "org.openjfx:javafx-controls:17"
    implementation "org.openjfx:javafx-graphics:17"

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'organizaai.Main'
}

javafx {
    version = "17" 
    modules = [ 'javafx.controls' ]
}

// Garante a leitura da entrada do usuário
tasks.named('run') {
    standardInput = System.in
    jvmArgs '-Dfile.encoding=UTF-8'
}

// Garante que a compilação leia os arquivos-fonte em UTF-8 (acentos em comentários e textos)
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Garante que a geração do Javadoc não falhe por causa de acentos nos comentários
tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}